name: Portfolio build and deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portfolio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Build Windows Model Lab companion
        env:
          CGO_ENABLED: 0
        run: |
          mkdir -p dist/visualizer
          GOOS=windows GOARCH=amd64 go build -C companion/windows-model-lab -trimpath -ldflags="-H=windowsgui -s -w" -o ../../dist/visualizer/AI-Visualizer-Model-Lab.exe .
          test -s dist/visualizer/AI-Visualizer-Model-Lab.exe

      - name: Configure deployment authentication
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Publish to gh-pages
        if: github.event_name != 'pull_request'
        run: npm run deploy

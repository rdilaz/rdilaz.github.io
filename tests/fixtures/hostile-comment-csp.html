  <body>
    <canvas id="art"></canvas>
    <script>
      const canvas = document.getElementById('art');
      const context = canvas.getContext('2d');
      canvas.width = 640;
      canvas.height = 360;
      VIZ.onFrame(() => {});
      function draw() {
        VIZ.frame;
        context.fillStyle = '#2cced2';
        context.fillRect(0, 0, canvas.width, canvas.height);
        requestAnimationFrame(draw);
      }
      draw();
    </script>

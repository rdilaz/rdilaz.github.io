<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #071014; }
    #scene { position: fixed; inset: 0; display: block; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <script>
    const canvas = document.getElementById('scene');
    const context = canvas.getContext('2d');
    let width = 0;
    let height = 0;
    let dpr = 1;

    VIZ.onFrame(frame => {
      const viewport = frame.viewport || VIZ.viewport;
      if (viewport.width !== width || viewport.height !== height || viewport.dpr !== dpr) {
        width = viewport.width;
        height = viewport.height;
        dpr = viewport.dpr;
        canvas.width = Math.round(width * dpr);
        canvas.height = Math.round(height * dpr);
      }

      const iterations = width >= 1500 ? 900000 : 18000;
      let field = 0;
      for (let index = 1; index <= iterations; index += 1) {
        field += Math.sin(index * 0.0017 + frame.time) * Math.cos(index * 0.0023 - frame.time);
      }
      const energy = Math.abs(field % 80);
      context.setTransform(dpr, 0, 0, dpr, 0, 0);
      context.fillStyle = '#071014';
      context.fillRect(0, 0, width, height);
      context.fillStyle = `hsl(${180 + energy} 72% 58%)`;
      context.beginPath();
      context.arc(width / 2, height / 2, Math.max(24, Math.min(width, height) * 0.22), 0, Math.PI * 2);
      context.fill();
    });
  </script>
</body>
</html>

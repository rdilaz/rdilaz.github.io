<!doctype html><html><head><meta charset="utf-8"><style>html,body,canvas{margin:0;width:100%;height:100%;overflow:hidden;background:#050506}</style></head><body><canvas id="c"></canvas><script>
const c=document.getElementById('c'),x=c.getContext('2d');let frame=VIZ.frame,t=0;VIZ.onFrame(next=>{frame=next});function draw(){requestAnimationFrame(draw);const d=Math.min(devicePixelRatio||1,2),w=Math.max(1,innerWidth),h=Math.max(1,innerHeight);if(c.width!==w*d||c.height!==h*d){c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0)}t+=.016;const b=frame.audio.bands.bass||0;const g=x.createLinearGradient(0,0,w,h);g.addColorStop(0,`hsl(${180+b*100} 85% 45%)`);g.addColorStop(1,`hsl(${300+b*40} 80% 20%)`);x.fillStyle=g;x.fillRect(0,0,w,h);x.beginPath();x.arc(w/2,h/2,30+b*Math.min(w,h)*.25+Math.sin(t)*8,0,Math.PI*2);x.fillStyle='rgba(255,255,255,.7)';x.fill()}draw();
</script></body></html>

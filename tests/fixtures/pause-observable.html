<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #14213d; }
      body { animation: breathe 2s linear infinite alternate; }
      @keyframes breathe { to { filter: hue-rotate(70deg); } }
    </style>
  </head>
  <body>
    <canvas id="art"></canvas>
    <script>
      const canvas = document.getElementById('art');
      const context = canvas.getContext('2d');
      canvas.width = 640;
      canvas.height = 360;
      VIZ.onFrame(() => {});
      setTimeout(() => {
        requestAnimationFrame(() => {
          VIZ.frame;
          context.fillStyle = '#fca311';
          context.fillRect(0, 0, canvas.width, canvas.height);
        });
      }, 260);
    </script>
  </body>
</html>

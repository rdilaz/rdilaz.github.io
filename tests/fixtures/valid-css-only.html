<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 35% 30%,#ff63d8 0 12%,transparent 36%),linear-gradient(135deg,#150035,#00395c);animation:breathe 4s ease-in-out infinite alternate}@keyframes breathe{to{filter:hue-rotate(40deg) saturate(1.25)}}</style></head><body><script>VIZ.onFrame(frame=>{document.documentElement.style.setProperty('--energy',String(frame.audio.volume||0))});requestAnimationFrame(function tick(){VIZ.frame;requestAnimationFrame(tick)});</script></body></html>

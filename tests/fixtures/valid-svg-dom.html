<!doctype html><html><head><meta charset="utf-8"><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090514}svg{width:100%;height:100%}circle{transform-origin:center;transition:r .05s linear}#word{position:fixed;inset:auto 0 8%;text-align:center;font:700 8vw system-ui;color:white;letter-spacing:.08em}</style></head><body><svg viewBox="0 0 100 100"><defs><radialGradient id="g"><stop stop-color="#fff"/><stop offset="1" stop-color="#7858ff"/></radialGradient></defs><circle id="orb" cx="50" cy="50" r="18" fill="url(#g)"/></svg><div id="word">LISTEN</div><script>const orb=document.getElementById('orb'),word=document.getElementById('word');VIZ.onFrame(f=>{const v=f.audio.volume||0;orb.setAttribute('r',18+v*28);word.style.opacity=String(.35+v*.65);word.style.transform=`translateY(${(f.audio.stereo.balance||0)*20}px)`});requestAnimationFrame(function tick(){VIZ.frame;requestAnimationFrame(tick)});</script></body></html>

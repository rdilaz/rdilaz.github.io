<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Host-authored V2 Reactivity Reference - test only</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#071018}
    canvas{position:fixed;inset:0}
  </style>
</head>
<body>
  <canvas id="reference"></canvas>
  <script>
    (() => {
      'use strict';
      const canvas = document.getElementById('reference');
      const context = canvas.getContext('2d');
      function resize() {
        const dpr = Math.max(1, Number(VIZ.viewport?.dpr) || 1);
        canvas.width = Math.max(1, Math.round(innerWidth * dpr));
        canvas.height = Math.max(1, Math.round(innerHeight * dpr));
        context.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      function render(frame = VIZ.frame) {
        if (canvas.width !== Math.round(innerWidth * (Number(VIZ.viewport?.dpr) || 1))) resize();
        const width = innerWidth;
        const height = innerHeight;
        const expressive = frame.audio?.expressive;
        const dynamics = expressive?.dynamics || {};
        const events = expressive?.events || {};
        const rhythm = expressive?.rhythm || {};
        const frequency = expressive?.frequency || { logBands: [] };
        context.fillStyle = '#071018';
        context.fillRect(0, 0, width, height);

        const quietness = Number(dynamics.quietness) || 0;
        if (quietness > 0) {
          context.strokeStyle = `rgba(72,210,255,${0.25 + quietness * 0.7})`;
          context.lineWidth = 2 + quietness * 5;
          for (let ring = 1; ring <= 4; ring += 1) {
            context.beginPath();
            context.arc(width * 0.22, height * 0.5, ring * Math.min(width, height) * 0.075, 0, Math.PI * 2);
            context.stroke();
          }
        }

        const low = Number(events.lowImpact?.pulse) || 0;
        if (low > 0) {
          context.fillStyle = `rgba(255,70,88,${0.3 + low * 0.7})`;
          context.beginPath();
          context.moveTo(0, height);
          context.quadraticCurveTo(width * 0.5, height * (0.08 + 0.38 * (1 - low)), width, height);
          context.closePath();
          context.fill();
        }

        const mid = Number(events.midHit?.pulse) || 0;
        if (mid > 0) {
          const radius = Math.min(width, height) * (0.12 + mid * 0.22);
          context.fillStyle = `rgba(88,255,154,${0.3 + mid * 0.7})`;
          context.beginPath();
          for (let point = 0; point < 6; point += 1) {
            const angle = -Math.PI / 2 + point * Math.PI / 3;
            const x = width * 0.5 + Math.cos(angle) * radius;
            const y = height * 0.5 + Math.sin(angle) * radius;
            if (!point) context.moveTo(x, y);
            else context.lineTo(x, y);
          }
          context.closePath();
          context.fill();
        }

        const high = Number(events.highSpark?.pulse) || 0;
        if (high > 0) {
          context.strokeStyle = `rgba(255,220,76,${0.35 + high * 0.65})`;
          context.lineWidth = 2 + high * 4;
          for (let ray = 0; ray < 12; ray += 1) {
            const angle = ray * Math.PI / 6;
            const inner = Math.min(width, height) * 0.08;
            const outer = Math.min(width, height) * (0.16 + high * 0.18);
            context.beginPath();
            context.moveTo(width * 0.78 + Math.cos(angle) * inner, height * 0.28 + Math.sin(angle) * inner);
            context.lineTo(width * 0.78 + Math.cos(angle) * outer, height * 0.28 + Math.sin(angle) * outer);
            context.stroke();
          }
        }

        const bands = Array.isArray(frequency.logBands) ? frequency.logBands : [];
        if (bands.some(value => Number(value) > 0)) {
          const barWidth = width / 30;
          for (let index = 0; index < 24; index += 1) {
            const amount = Math.max(0, Math.min(1, Number(bands[index]) || 0));
            context.fillStyle = `hsl(${255 + index * 3} 85% ${45 + amount * 25}%)`;
            context.fillRect(width * 0.1 + index * barWidth, height * 0.92 - amount * height * 0.55, barWidth * 0.65, amount * height * 0.55);
          }
        }

        const confidence = Number(rhythm.confidence) || 0;
        if (confidence > 0) {
          const phase = Math.max(0, Math.min(1, Number(rhythm.phase) || 0));
          const radius = Math.min(width, height) * 0.28;
          const angle = phase * Math.PI * 2 - Math.PI / 2;
          context.strokeStyle = `rgba(238,244,255,${0.35 + confidence * 0.65})`;
          context.lineWidth = 8;
          context.beginPath();
          context.arc(width * 0.5, height * 0.5, radius, 0, Math.PI * 2);
          context.stroke();
          context.beginPath();
          context.moveTo(width * 0.5, height * 0.5);
          context.lineTo(width * 0.5 + Math.cos(angle) * radius, height * 0.5 + Math.sin(angle) * radius);
          context.stroke();
        }

        context.fillStyle = '#d9e9f2';
        context.font = '600 13px system-ui,sans-serif';
        context.fillText('HOST-AUTHORED V2 TEST REFERENCE', 18, 26);
      }
      addEventListener('resize', () => { resize(); render(); });
      resize();
      VIZ.onFrame(render);
      render();
    })();
  </script>
</body>
</html>

<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Calibration Bloom</title>
    <style>
      html, body, canvas { margin: 0; width: 100%; height: 100%; display: block; overflow: hidden; background: #050506; }
      .whisper { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); font: 500 11px/1.4 ui-sans-serif, -apple-system, sans-serif; letter-spacing: .18em; text-transform: uppercase; color: rgba(255, 255, 255, .24); pointer-events: none; transition: opacity .8s ease; text-align: center; }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div class="whisper" id="whisper">connect audio<br>then choose a model</div>
    <script>
      const canvas = document.querySelector('#c');
      const ctx = canvas.getContext('2d');
      const whisper = document.querySelector('#whisper');
      let w = 0;
      let h = 0;
      let dpr = 1;
      let t = 0;
      let echoes = [];
      function resize() {
        dpr = Math.min(devicePixelRatio || 1, 2);
        w = innerWidth;
        h = innerHeight;
        canvas.width = w * dpr;
        canvas.height = h * dpr;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }
      addEventListener('resize', resize);
      resize();
      function frame() {
        requestAnimationFrame(frame);
        const f = VIZ.frame;
        const a = f.audio;
        const b = a.bands || {};
        const bass = b.bass || 0;
        const mid = b.mid || 0;
        const hi = b.treble || 0;
        const cent = a.spectralCentroid || 0;
        t += .006 + mid * .006;
        whisper.style.opacity = a.connected ? 0 : .9;
        const bg = ctx.createLinearGradient(0, 0, w, h);
        bg.addColorStop(0, '#040406');
        bg.addColorStop(.5, `hsl(${220 + cent * 70} 18% ${5 + bass * 4}%)`);
        bg.addColorStop(1, '#020203');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'lighter';
        const wave = a.waveform || [];
        for (let layer = 0; layer < 13; layer += 1) {
          const p = layer / 12;
          const hue = 190 + cent * 150 + layer * 9;
          const alpha = .018 + p * .018 + hi * .025;
          ctx.beginPath();
          ctx.strokeStyle = `hsla(${hue},78%,72%,${alpha})`;
          ctx.lineWidth = 1 + (1 - p) * 3 + bass * 2;
          for (let i = 0; i <= 120; i += 1) {
            const x = i / 120 * w;
            const sample = wave[Math.floor(i / 120 * Math.max(0, wave.length - 1))] || 0;
            const envelope = Math.sin(i / 120 * Math.PI);
            const y = h * (.5 + (p - .5) * .56) + sample * (28 + 120 * p) * envelope + Math.sin(i * .085 + t * (1.3 + p)) * 18 * (.2 + mid);
            if (i) ctx.lineTo(x, y);
            else ctx.moveTo(x, y);
          }
          ctx.stroke();
        }
        if ((a.transient || 0) > .55) echoes.push({ r: 12, life: 1, hue: 190 + cent * 150 });
        echoes = echoes.filter(echo => echo.life > .02);
        echoes.forEach(echo => {
          echo.r += 3 + 30 * (a.beat || 0);
          echo.life *= .94;
          ctx.strokeStyle = `hsla(${echo.hue},85%,80%,${echo.life * .18})`;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.ellipse(w / 2, h / 2, echo.r * 2.4, echo.r * .65, 0, 0, Math.PI * 2);
          ctx.stroke();
        });
        const glow = ctx.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, Math.min(w, h) * (.16 + bass * .12));
        glow.addColorStop(0, `hsla(${215 + cent * 90},90%,88%,${.12 + a.volume * .14})`);
        glow.addColorStop(.24, `hsla(${250 + cent * 80},80%,60%,${.035 + mid * .04})`);
        glow.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = glow;
        ctx.fillRect(0, 0, w, h);
        ctx.globalCompositeOperation = 'source-over';
      }
      requestAnimationFrame(frame);
    </script>
  </body>
</html>

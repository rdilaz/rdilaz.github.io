<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visualizer Reliability Test Harness</title>
  <link rel="stylesheet" href="./reliability.css">
  <style>html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}iframe{border:0}</style>
</head>
<body>
  <iframe id="fixture" class="preflight-frame" sandbox="allow-scripts" aria-hidden="true"></iframe>
  <script type="module">
    import { VisualizerSandbox } from './sandbox.js';
    import { DreamReliabilityHarness, createSyntheticFrame } from './reliability.js';

    const iframe = document.getElementById('fixture');
    const sandbox = new VisualizerSandbox(iframe);

    window.runReliabilityFixture = async html => {
      const harness = new DreamReliabilityHarness({ sandbox });
      const result = await harness.preflight(html, {
        viewport: { width: 800, height: 450, dpr: 1 },
        fastViewport: { width: 640, height: 360, dpr: 1 },
      });
      sandbox.clear();
      return result;
    };

    window.runWatchdogFixture = async html => {
      const harness = new DreamReliabilityHarness({ sandbox });
      const preflight = await harness.preflight(html, {
        viewport: { width: 800, height: 450, dpr: 1 },
        fastViewport: { width: 640, height: 360, dpr: 1 },
      });
      if (!preflight.passed) {
        sandbox.clear();
        return { preflight, watchdog: null };
      }
      sandbox.setPresentation('promoting');
      const started = performance.now();
      let frameIndex = 0;
      const timer = setInterval(() => {
        sandbox.sendFrame(createSyntheticFrame(frameIndex++, performance.now() - started, { width: 800, height: 450, dpr: 1 }));
      }, 16);
      const watchdog = await harness.watchdog({ durationMs: 3800 });
      clearInterval(timer);
      sandbox.clear();
      return { preflight, watchdog };
    };

    window.runPauseFixture = async html => {
      const viewport = { width: 640, height: 360, dpr: 1 };
      const boot = await sandbox.load(html, { viewport });
      const sessionId = sandbox.sessionId;
      const started = performance.now();
      let frameIndex = 0;
      const timer = setInterval(() => {
        sandbox.sendFrame(createSyntheticFrame(frameIndex++, performance.now() - started, viewport));
      }, 16);
      await new Promise(resolve => setTimeout(resolve, 40));
      const before = await sandbox.probe('pause-before');
      const firstPause = sandbox.setPaused(true);
      const repeatedPause = sandbox.setPaused(true);
      await sandbox.waitForPlayback(true);
      const pauseApplied = await sandbox.probe('pause-applied');
      await new Promise(resolve => setTimeout(resolve, 1150));
      const paused = await sandbox.probe('pause-held');
      const pausedHeartbeatAgeMs = sandbox.heartbeatAgeMs();
      const firstResume = sandbox.setPaused(false);
      const repeatedResume = sandbox.setPaused(false);
      await sandbox.waitForPlayback(false);
      await new Promise(resolve => setTimeout(resolve, 120));
      const resumed = await sandbox.probe('pause-resumed');
      clearInterval(timer);
      const result = {
        boot,
        sessionUnchanged: sandbox.sessionId === sessionId,
        firstPause,
        repeatedPause,
        firstResume,
        repeatedResume,
        pausedHeartbeatAgeMs,
        before,
        pauseApplied,
        paused,
        resumed,
      };
      sandbox.clear();
      return result;
    };

    window.runPreBridgePauseFixture = async html => {
      sandbox.setPaused(false);
      sandbox.clear();
      const firstPause = sandbox.setPaused(true);
      const repeatedPause = sandbox.setPaused(true);
      const boot = await sandbox.load(html, { viewport: { width: 640, height: 360, dpr: 1 } });
      await sandbox.waitForPlayback(true);
      const applied = await sandbox.probe('pre-bridge-pause-applied');
      await new Promise(resolve => setTimeout(resolve, 320));
      const held = await sandbox.probe('pre-bridge-pause-held');
      const firstResume = sandbox.setPaused(false);
      await sandbox.waitForPlayback(false);
      const result = { boot, firstPause, repeatedPause, firstResume, applied, held };
      sandbox.clear();
      return result;
    };

    window.runClearedSlotPauseFixture = async html => {
      sandbox.setPaused(false);
      sandbox.clear();
      sandbox.setPaused(true);
      await sandbox.load(html, { viewport: { width: 640, height: 360, dpr: 1 } });
      await sandbox.waitForPlayback(true);
      sandbox.clear();
      const staleAfterClear = sandbox.isPaused();
      const harness = new DreamReliabilityHarness({ sandbox });
      const nextPreflight = await harness.preflight(html, {
        viewport: { width: 800, height: 450, dpr: 1 },
      });
      sandbox.clear();
      return { staleAfterClear, nextPreflight };
    };

    window.__reliabilityHarnessReady = true;
  </script>
</body>
</html>

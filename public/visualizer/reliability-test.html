<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Visualizer Reliability Test Harness</title>
  <link rel="stylesheet" href="./reliability.css">
  <style>html,body{margin:0;width:100%;height:100%;background:#111;overflow:hidden}iframe{border:0}</style>
</head>
<body>
  <iframe id="fixture" class="preflight-frame" sandbox="allow-scripts" aria-hidden="true"></iframe>
  <button id="audioFixtureStart" type="button" style="position:fixed;right:4px;bottom:4px;z-index:20">Run audio fixture</button>
  <script type="module">
    import { VisualizerSandbox } from './sandbox.js';
    import { DreamReliabilityHarness, createSyntheticFrame, latestCurrentVisualReport } from './reliability.js';
    import { AudioEngine } from './audio-engine.js';
    import { createInitialVisualizerFrame } from './audio-contract.js';

    const iframe = document.getElementById('fixture');
    const sandbox = new VisualizerSandbox(iframe);

    window.runReliabilityFixture = async (html, audioApiVersion = 'visualizer-audio-v1') => {
      const harness = new DreamReliabilityHarness({ sandbox, audioApiVersion });
      const result = await harness.preflight(html, {
        viewport: { width: 800, height: 450, dpr: 1 },
        fastViewport: { width: 640, height: 360, dpr: 1 },
      });
      sandbox.clear();
      return result;
    };

    window.runWatchdogFixture = async html => {
      const harness = new DreamReliabilityHarness({ sandbox });
      const preflight = await harness.preflight(html, {
        viewport: { width: 800, height: 450, dpr: 1 },
        fastViewport: { width: 640, height: 360, dpr: 1 },
      });
      if (!preflight.passed) {
        sandbox.clear();
        return { preflight, watchdog: null };
      }
      sandbox.setPresentation('promoting');
      const started = performance.now();
      let frameIndex = 0;
      const timer = setInterval(() => {
        sandbox.sendFrame(createSyntheticFrame(frameIndex++, performance.now() - started, { width: 800, height: 450, dpr: 1 }));
      }, 16);
      const previousReport = latestCurrentVisualReport(preflight);
      const watchdog = await harness.watchdog({ durationMs: 3800, previousReport });
      clearInterval(timer);
      sandbox.clear();
      return { preflight, watchdog };
    };

    window.runReopenWatchdogFixture = async html => {
      const harness = new DreamReliabilityHarness({ sandbox });
      const viewport = { width: 800, height: 450, dpr: 1 };
      const reopen = await harness.reopen(html, { viewport });
      if (!reopen.passed) {
        sandbox.clear();
        return { reopen, watchdog: null };
      }
      sandbox.setPresentation('promoting');
      const started = performance.now();
      let frameIndex = 0;
      const timer = setInterval(() => {
        sandbox.sendFrame(createSyntheticFrame(frameIndex++, performance.now() - started, viewport));
      }, 16);
      const previousReport = latestCurrentVisualReport(reopen);
      const watchdog = await harness.watchdog({ durationMs: 3800, previousReport });
      clearInterval(timer);
      sandbox.clear();
      return { reopen, watchdog };
    };

    window.runPriorVisualLossWatchdogFixture = async () => {
      const canvas = (informative, renderInformative = false) => ({
        id: 'canvas-1',
        elementId: 'scene',
        coverage: 1,
        pixel: { sampled: true, informative },
        activity: { type: 'webgl2', drawCalls: 10, programsLinked: 1, lastActivityAt: 10, preserveDrawingBuffer: false },
        renderPixel: renderInformative ? { sampled: true, informative: true } : null,
        renderCaptureRequest: renderInformative ? 1 : 0,
        renderPixelDrawCalls: renderInformative ? 10 : 0,
        successfulActivity: true,
      });
      const report = (informative, label, renderInformative = false) => ({
        schema: 'visualizer-probe-v1',
        label,
        visual: { visibleProof: true, renderCaptureRequest: 1, canvases: [canvas(informative, renderInformative)], dom: { visible: false } },
        renderer: { types: ['webgl2'], contextLosses: [], contextFailures: [], shaderFailures: [], programFailures: [] },
        viz: { consumed: true },
        runtime: { monitor: {} },
        logs: { consoleErrors: [] },
        events: [],
      });
      const previousReport = report(false, 'qualification-visible', true);
      let probes = 0;
      const stoppedSandbox = {
        events: [],
        fatalEvents: () => [],
        heartbeatAgeMs: () => 0,
        heartbeatSnapshot: () => ({ sessionId: 'stopped-session', receivedAt: probes, sandboxAtMs: probes, ageMs: 0 }),
        probe: async label => {
          probes += 1;
          return report(false, label);
        },
      };
      const harness = new DreamReliabilityHarness({ sandbox: stoppedSandbox });
      return harness.watchdog({ durationMs: 0, previousReport });
    };

    window.runPauseFixture = async html => {
      const viewport = { width: 640, height: 360, dpr: 1 };
      const boot = await sandbox.load(html, { viewport });
      const sessionId = sandbox.sessionId;
      const started = performance.now();
      let frameIndex = 0;
      const timer = setInterval(() => {
        sandbox.sendFrame(createSyntheticFrame(frameIndex++, performance.now() - started, viewport));
      }, 16);
      await new Promise(resolve => setTimeout(resolve, 40));
      const before = await sandbox.probe('pause-before');
      const firstPause = sandbox.setPaused(true);
      const repeatedPause = sandbox.setPaused(true);
      await sandbox.waitForPlayback(true);
      const pauseApplied = await sandbox.probe('pause-applied');
      await new Promise(resolve => setTimeout(resolve, 1150));
      const paused = await sandbox.probe('pause-held');
      const pausedHeartbeatAgeMs = sandbox.heartbeatAgeMs();
      const firstResume = sandbox.setPaused(false);
      const repeatedResume = sandbox.setPaused(false);
      await sandbox.waitForPlayback(false);
      await new Promise(resolve => setTimeout(resolve, 120));
      const resumed = await sandbox.probe('pause-resumed');
      clearInterval(timer);
      const result = {
        boot,
        sessionUnchanged: sandbox.sessionId === sessionId,
        firstPause,
        repeatedPause,
        firstResume,
        repeatedResume,
        pausedHeartbeatAgeMs,
        before,
        pauseApplied,
        paused,
        resumed,
      };
      sandbox.clear();
      return result;
    };

    window.runAudioContractFixture = async (html, requestedVersion) => {
      const viewport = { width: 640, height: 360, dpr: 1 };
      const boot = await sandbox.load(html, { viewport, audioApiVersion: requestedVersion });
      sandbox.sendFrame(createSyntheticFrame(12, 430, viewport, 30, 'visualizer-audio-v2'));
      await sandbox.waitForFrameDelivery({ label: 'audio contract projection' });
      const report = await sandbox.probe('audio-contract-projection');
      const result = {
        boot,
        requestedVersion: requestedVersion ?? null,
        effectiveVersion: sandbox.audioApiVersion,
        report,
      };
      sandbox.clear();
      return result;
    };

    window.runAudioContractReplacementFixture = async html => {
      const results = [];
      for (const requestedVersion of ['visualizer-audio-v2', 'unknown-audio-contract', null, 'visualizer-audio-v1']) {
        results.push(await window.runAudioContractFixture(html, requestedVersion));
      }
      return results;
    };

    window.runPreBridgePauseFixture = async html => {
      sandbox.setPaused(false);
      sandbox.clear();
      const firstPause = sandbox.setPaused(true);
      const repeatedPause = sandbox.setPaused(true);
      const boot = await sandbox.load(html, { viewport: { width: 640, height: 360, dpr: 1 } });
      await sandbox.waitForPlayback(true);
      const applied = await sandbox.probe('pre-bridge-pause-applied');
      await new Promise(resolve => setTimeout(resolve, 320));
      const held = await sandbox.probe('pre-bridge-pause-held');
      const firstResume = sandbox.setPaused(false);
      await sandbox.waitForPlayback(false);
      const result = { boot, firstPause, repeatedPause, firstResume, applied, held };
      sandbox.clear();
      return result;
    };

    window.runClearedSlotPauseFixture = async html => {
      sandbox.setPaused(false);
      sandbox.clear();
      sandbox.setPaused(true);
      await sandbox.load(html, { viewport: { width: 640, height: 360, dpr: 1 } });
      await sandbox.waitForPlayback(true);
      sandbox.clear();
      const staleAfterClear = sandbox.isPaused();
      const harness = new DreamReliabilityHarness({ sandbox });
      const nextPreflight = await harness.preflight(html, {
        viewport: { width: 800, height: 450, dpr: 1 },
      });
      sandbox.clear();
      return { staleAfterClear, nextPreflight };
    };

    window.runQualityGeometryFixture = async html => {
      const viewport = { width: 800, height: 450, dpr: 1 };
      const profiles = [
        { mode: 'saver', maxFps: 30, effectiveDpr: 1, nativeDpr: 2 },
        { mode: 'balanced', maxFps: 45, effectiveDpr: 1.5, nativeDpr: 2 },
        { mode: 'full', maxFps: 60, effectiveDpr: 2, nativeDpr: 2 },
        { mode: 'balanced', maxFps: 45, effectiveDpr: 1.5, nativeDpr: 2 },
        { mode: 'saver', maxFps: 30, effectiveDpr: 1, nativeDpr: 2 },
      ];
      sandbox.clear();
      sandbox.setPresentation('standby');
      sandbox.setRenderQuality(profiles[0]);
      const boot = await sandbox.load(html, { viewport });
      const sessionId = sandbox.sessionId;
      const srcdoc = iframe.srcdoc;

      async function settledProbe(profile, index) {
        sandbox.setRenderQuality(profile);
        const expectedWidth = Math.round(viewport.width * profile.effectiveDpr);
        const deadline = performance.now() + 1800;
        let report = null;
        while (performance.now() < deadline) {
          report = await sandbox.probe(`quality-geometry-${index}`, { timeoutMs: 600 });
          const scene = report.visual.canvases.find(canvas => canvas.elementId === 'scene');
          if (sandbox.appliedRenderQuality?.mode === profile.mode && scene?.backingWidth === expectedWidth) break;
          await new Promise(resolve => setTimeout(resolve, 20));
        }
        return {
          mode: profile.mode,
          sessionId: sandbox.sessionId,
          srcdocUnchanged: iframe.srcdoc === srcdoc,
          report,
        };
      }

      const transitions = [];
      for (let index = 0; index < profiles.length; index += 1) {
        transitions.push(await settledProbe(profiles[index], index));
      }
      sandbox.enterPassiveMode();
      async function probeMarker(expected, label) {
        const deadline = performance.now() + 1200;
        let report;
        while (performance.now() < deadline) {
          report = await sandbox.probe(label, { timeoutMs: 600 });
          const scene = report.visual.canvases.find(canvas => canvas.elementId === 'scene');
          if (scene?.hostViewportStabilized === expected) return report;
          await new Promise(resolve => setTimeout(resolve, 20));
        }
        return report;
      }
      sandbox.sendFrame({ pointer: { x: 0.25, y: 0.5, active: true, down: false } });
      const authoredInset = await probeMarker(false, 'quality-geometry-authored-inset');
      sandbox.sendFrame({ pointer: { x: 0.75, y: 0.5, active: true, down: false } });
      const restoredViewport = await probeMarker(true, 'quality-geometry-restored-viewport');
      const requalification = [];
      for (const [pointerX, expected, label] of [
        [0.1, false, 'ancestor-class-ineligible'],
        [0.2, true, 'ancestor-class-restored'],
        [0.3, false, 'canvas-attribute-ineligible'],
        [0.4, true, 'canvas-attribute-restored'],
        [0.5, false, 'added-stylesheet-ineligible'],
        [0.6, true, 'removed-stylesheet-restored'],
        [0.7, false, 'cssom-rule-ineligible'],
        [0.8, true, 'cssom-rule-restored'],
        [0.9, false, 'css-declaration-ineligible'],
        [0.95, true, 'css-declaration-restored'],
        [0.11, false, 'stylesheet-enabled-ineligible'],
        [0.12, true, 'stylesheet-disabled-restored'],
        [0.13, false, 'stylesheet-reenabled-ineligible'],
        [0.14, true, 'stylesheet-rule-removed'],
        [0.15, false, 'adopted-stylesheet-ineligible'],
        [0.16, true, 'adopted-stylesheet-removed'],
        [0.18, false, 'direct-css-declaration-ineligible'],
        [0.19, true, 'direct-css-declaration-restored'],
      ]) {
        sandbox.sendFrame({ pointer: { x: pointerX, y: 0.5, active: true, down: false } });
        const report = await probeMarker(expected, `quality-geometry-${label}`);
        requalification.push({ label, expected, report });
      }
      sandbox.sendFrame({ pointer: { x: 0.17, y: 0.5, active: true, down: false } });
      let markerForgery;
      const markerDeadline = performance.now() + 1200;
      while (performance.now() < markerDeadline) {
        markerForgery = await sandbox.probe('quality-geometry-marker-forgery', { timeoutMs: 600 });
        const small = markerForgery.visual.canvases.find(canvas => canvas.elementId === 'small');
        if (small && !small.hostViewportStabilized && small.width === 96) break;
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      sandbox.sendFrame({ pointer: { x: 0.21, y: 0.5, active: true, down: false } });
      let detachedCanvas;
      const detachedDeadline = performance.now() + 1200;
      while (performance.now() < detachedDeadline) {
        detachedCanvas = await sandbox.probe('quality-geometry-detached-canvas', { timeoutMs: 600 });
        if (detachedCanvas.runtime.observedViewportCanvasCount === 3) break;
        await new Promise(resolve => setTimeout(resolve, 20));
      }
      const result = {
        boot,
        sessionId,
        transitions,
        authoredInset,
        restoredViewport,
        requalification,
        markerForgery,
        detachedCanvas,
      };
      sandbox.clear();
      return result;
    };

    window.runHeartbeatWatchdogFixture = async (html, mode) => {
      sandbox.clear();
      const harness = new DreamReliabilityHarness({ sandbox });
      const viewport = { width: 800, height: 450, dpr: 1 };
      const preflight = await harness.preflight(html, { viewport, fastViewport: viewport });
      if (!preflight.passed) return { preflight, watchdog: null };
      sandbox.setPresentation('promoting');
      const originalSnapshot = sandbox.heartbeatSnapshot.bind(sandbox);
      const originalProbe = sandbox.probe.bind(sandbox);
      const stale = { sessionId: sandbox.sessionId, receivedAt: 1, sandboxAtMs: 1, ageMs: 4700 };
      let fatalTimer = 0;
      if (mode === 'transient') {
        sandbox.heartbeatSnapshot = () => stale;
      } else if (mode === 'permanent') {
        sandbox.heartbeatSnapshot = () => stale;
        sandbox.probe = async () => { throw new Error('Fixture confirmation probe timed out.'); };
      } else if (mode === 'fatal') {
        fatalTimer = setTimeout(() => {
          sandbox.events.push({ severity: 'fatal', code: 'RUNTIME_ERROR', message: 'Fixture fatal runtime event.' });
        }, 0);
      }
      const started = performance.now();
      const watchdog = await harness.watchdog({ durationMs: mode === 'fatal' ? 40 : 0 });
      const elapsedMs = performance.now() - started;
      clearTimeout(fatalTimer);
      sandbox.heartbeatSnapshot = originalSnapshot;
      sandbox.probe = originalProbe;
      sandbox.clear();
      return { preflight, watchdog, elapsedMs };
    };

    window.runHeavyReliabilityFixture = async html => {
      sandbox.clear();
      sandbox.setRenderQuality({ mode: 'saver', maxFps: 30, effectiveDpr: 1, nativeDpr: 2 });
      const harness = new DreamReliabilityHarness({ sandbox });
      const result = await harness.preflight(html, {
        viewport: { width: 2048, height: 1100, dpr: 1 },
      });
      sandbox.clear();
      return result;
    };

    window.runFrameBackpressureFixture = async (html, frameCount = 180) => {
      sandbox.clear();
      sandbox.setPresentation('standby');
      const viewport = { width: 2048, height: 1100, dpr: 1 };
      sandbox.setRenderQuality({ mode: 'saver', maxFps: 30, effectiveDpr: 1, nativeDpr: 2 });
      const boot = await sandbox.load(html, { viewport });
      const sessionId = sandbox.sessionId;
      for (let index = 0; index < frameCount; index += 1) {
        sandbox.sendFrame(createSyntheticFrame(index, index * 16, viewport, 60));
      }
      const queued = sandbox.frameDeliverySnapshot();
      await sandbox.waitForFrameDelivery({ timeoutMs: 2800, label: 'backpressure stress drain' });
      const report = await sandbox.probe('backpressure-stress', { timeoutMs: 2800 });
      const settled = sandbox.frameDeliverySnapshot();
      const result = { boot, sessionId, queued, settled, report };
      sandbox.clear();
      return result;
    };

    window.runFrameSessionReplacementFixture = async (heavyHtml, replacementHtml) => {
      sandbox.clear();
      sandbox.setPresentation('standby');
      const viewport = { width: 2048, height: 1100, dpr: 1 };
      await sandbox.load(heavyHtml, { viewport });
      const oldSessionId = sandbox.sessionId;
      for (let index = 0; index < 120; index += 1) {
        sandbox.sendFrame(createSyntheticFrame(index, index * 16, viewport, 60));
      }
      const oldDelivery = sandbox.frameDeliverySnapshot();
      const oldWait = sandbox.waitForFrameDelivery({ timeoutMs: 2200, label: 'old session' })
        .then(() => null, error => error.message);
      const replacementBoot = await sandbox.load(replacementHtml, { viewport: { width: 640, height: 360, dpr: 1 } });
      const oldWaitError = await oldWait;
      const newSessionId = sandbox.sessionId;
      const replacementFrame = createSyntheticFrame(0, 999, { width: 640, height: 360, dpr: 1 }, 30);
      sandbox.sendFrame(replacementFrame);
      const report = await sandbox.probe('replacement-session', { timeoutMs: 2200 });
      const newDelivery = sandbox.frameDeliverySnapshot();
      sandbox.clear();
      return { oldSessionId, newSessionId, oldDelivery, oldWaitError, replacementBoot, newDelivery, report };
    };

    window.runFramePauseBackpressureFixture = async html => {
      sandbox.clear();
      sandbox.setPresentation('standby');
      const viewport = { width: 2048, height: 1100, dpr: 1 };
      await sandbox.load(html, { viewport });
      for (let index = 0; index < 180; index += 1) {
        sandbox.sendFrame(createSyntheticFrame(index, index * 16, viewport, 60));
      }
      const queued = sandbox.frameDeliverySnapshot();
      sandbox.setPaused(true);
      await sandbox.waitForPlayback(true, 1600);
      const pausedReport = await sandbox.probe('backpressure-paused', { timeoutMs: 2200 });
      const pausedDelivery = sandbox.frameDeliverySnapshot();
      const acceptedWhilePaused = sandbox.sendFrame(createSyntheticFrame(180, 10000, viewport, 60));
      sandbox.setPaused(false);
      await sandbox.waitForPlayback(false, 1600);
      sandbox.sendFrame(createSyntheticFrame(181, 20000, viewport, 30));
      const resumedReport = await sandbox.probe('backpressure-resumed', { timeoutMs: 2200 });
      const resumedDelivery = sandbox.frameDeliverySnapshot();
      sandbox.clear();
      return { queued, pausedReport, pausedDelivery, acceptedWhilePaused, resumedReport, resumedDelivery };
    };

    window.runFrameQualityBackpressureFixture = async html => {
      sandbox.clear();
      sandbox.setPresentation('standby');
      const viewport = { width: 2048, height: 1100, dpr: 1 };
      sandbox.setRenderQuality({ mode: 'saver', maxFps: 30, effectiveDpr: 1, nativeDpr: 2 });
      await sandbox.load(html, { viewport });
      const sessionId = sandbox.sessionId;
      const srcdoc = iframe.srcdoc;
      for (let index = 0; index < 180; index += 1) {
        sandbox.sendFrame(createSyntheticFrame(index, index * 16, viewport, 60));
      }
      const queued = sandbox.frameDeliverySnapshot();
      sandbox.setRenderQuality({ mode: 'balanced', maxFps: 45, effectiveDpr: 1.5, nativeDpr: 2 });
      const afterQuality = await sandbox.probe('backpressure-quality-applied', { timeoutMs: 2200 });
      const freshViewport = { ...viewport, dpr: 1.5 };
      sandbox.sendFrame(createSyntheticFrame(181, 20000, freshViewport, 45));
      const report = await sandbox.probe('backpressure-quality-fresh-frame', { timeoutMs: 2200 });
      const delivery = sandbox.frameDeliverySnapshot();
      const result = {
        queued,
        afterQuality,
        report,
        delivery,
        sessionUnchanged: sandbox.sessionId === sessionId,
        srcdocUnchanged: iframe.srcdoc === srcdoc,
      };
      sandbox.clear();
      return result;
    };

    window.runFrameTimingFixture = async html => {
      sandbox.clear();
      sandbox.setPresentation('standby');
      const viewport = { width: 2048, height: 1100, dpr: 1 };
      const deliveries = [];
      const originalOnEvent = sandbox.onEvent;
      sandbox.onEvent = message => {
        if (message.type === 'frame-delivered' && message.delivered) deliveries.push(message);
      };
      const boot = await sandbox.load(html, { viewport });
      const timedFrame = (time, deltaTime) => ({
        ...createSyntheticFrame(0, time * 1000, viewport, 60),
        time,
        deltaTime,
      });

      sandbox.sendFrame(timedFrame(1, 0.02));
      await sandbox.waitForFrameDelivery({ timeoutMs: 2800, label: 'timing initial frame' });
      sandbox.sendFrame(timedFrame(1.1, 0.1));
      await sandbox.waitForFrameDelivery({ timeoutMs: 2800, label: 'timing normal frame' });
      const noCoalescing = deliveries.slice();

      for (let step = 1; step <= 11; step += 1) sandbox.sendFrame(timedFrame(Number((1.1 + step / 10).toFixed(1)), 0.1));
      const firstQueued = sandbox.frameDeliverySnapshot();
      await sandbox.waitForFrameDelivery({ timeoutMs: 2800, label: 'timing first coalescing cycle' });
      const firstCycle = deliveries.slice(noCoalescing.length);

      for (let step = 1; step <= 11; step += 1) sandbox.sendFrame(timedFrame(Number((2.2 + step / 10).toFixed(1)), 0.1));
      const secondQueued = sandbox.frameDeliverySnapshot();
      await sandbox.waitForFrameDelivery({ timeoutMs: 2800, label: 'timing second coalescing cycle' });
      const secondCycle = deliveries.slice(noCoalescing.length + firstCycle.length);

      const result = {
        boot,
        noCoalescing,
        firstQueued,
        firstCycle,
        secondQueued,
        secondCycle,
        deliveries,
        report: await sandbox.probe('timing-proof', { timeoutMs: 2200 }),
      };
      sandbox.onEvent = originalOnEvent;
      sandbox.clear();
      return result;
    };

    window.runFrozenQualificationFixture = async html => {
      sandbox.clear();
      sandbox.setRenderQuality({ mode: 'saver', maxFps: 30, effectiveDpr: 1, nativeDpr: 2 });
      const harness = new DreamReliabilityHarness({ sandbox });
      const started = performance.now();
      try {
        const report = await harness.preflight(html, {
          viewport: { width: 2048, height: 1100, dpr: 1 },
          fastViewport: { width: 640, height: 360, dpr: 1 },
        });
        return { report, error: null, elapsedMs: performance.now() - started };
      } catch (error) {
        return { report: null, error: { name: error.name, message: error.message }, elapsedMs: performance.now() - started };
      } finally {
        sandbox.clear();
      }
    };

    window.runFatalDeliveryFixture = async html => {
      sandbox.clear();
      const viewport = { width: 640, height: 360, dpr: 1 };
      const boot = await sandbox.load(html, { viewport });
      const started = performance.now();
      for (let index = 0; index < 180; index += 1) {
        sandbox.sendFrame(createSyntheticFrame(index, index * 16, viewport));
      }
      while (!sandbox.fatalEvents().length && performance.now() - started < 900) {
        await new Promise(resolve => setTimeout(resolve, 10));
      }
      await sandbox.waitForFrameDelivery({ timeoutMs: 900, label: 'fatal delivery drain' });
      const acceptedAfterFatal = sandbox.sendFrame(createSyntheticFrame(180, 3000, viewport));
      const result = {
        boot,
        fatal: sandbox.fatalEvents()[0] || null,
        elapsedMs: performance.now() - started,
        delivery: sandbox.frameDeliverySnapshot(),
        acceptedAfterFatal,
      };
      sandbox.clear();
      return result;
    };

    window.showExpressiveReferenceStimulus = async (html, stimulus) => {
      const viewport = { width: 800, height: 450, dpr: 1 };
      sandbox.clear();
      sandbox.setPresentation('active');
      const boot = await sandbox.load(html, { viewport, audioApiVersion: 'visualizer-audio-v2' });
      const frame = createInitialVisualizerFrame('visualizer-audio-v2', viewport);
      frame.time = 1;
      frame.deltaTime = 1 / 30;
      frame.audio.connected = true;
      frame.audio.silence = false;
      frame.audio.expressive.dynamics.quietness = 0;
      if (stimulus === 'quietness') {
        frame.audio.silence = true;
        frame.audio.expressive.dynamics.quietness = 1;
        frame.audio.expressive.dynamics.silenceSeconds = 3.4;
      } else if (stimulus === 'lowImpact') {
        frame.audio.expressive.events.lowImpact = { pulse: 0.92, strength: 0.82, ageSeconds: 0 };
      } else if (stimulus === 'midHit') {
        frame.audio.expressive.events.midHit = { pulse: 0.86, strength: 0.76, ageSeconds: 0 };
      } else if (stimulus === 'highSpark') {
        frame.audio.expressive.events.highSpark = { pulse: 0.9, strength: 0.8, ageSeconds: 0 };
      } else if (stimulus === 'logBands') {
        frame.audio.expressive.frequency.logBands = Array.from({ length: 24 }, (_unused, index) => (
          0.12 + 0.72 * Math.abs(Math.sin((index + 2) * 0.31))
        ));
      } else if (stimulus === 'beatPhase') {
        frame.audio.expressive.rhythm = { pulse: 0.55, phase: 0.68, tempo: 125, confidence: 0.88 };
      } else {
        throw new Error(`Unknown reference stimulus: ${stimulus}`);
      }
      sandbox.sendFrame(frame);
      await sandbox.waitForFrameDelivery({ label: 'expressive reference stimulus' });
      const report = await sandbox.probe(`expressive-reference-${stimulus}`);
      return { boot, stimulus, report };
    };

    window.clearExpressiveReference = () => {
      sandbox.clear();
      sandbox.setPresentation('standby');
    };

    let preparedAudioFixture = null;
    let audioFixturePromise = null;

    async function releasePreparedAudioFixture() {
      const prepared = preparedAudioFixture;
      preparedAudioFixture = null;
      if (!prepared) return;
      try { prepared.element?.pause(); } catch { /* Continue deterministic cleanup. */ }
      try { await prepared.engine?.stop('test-complete'); } catch { /* Test cleanup is best effort. */ }
      try { prepared.source?.stop(); } catch { /* A completed source is already stopped. */ }
      try { await prepared.sourceContext?.close(); } catch { /* Test cleanup is best effort. */ }
      prepared.element?.remove();
    }

    function emptyAudioSummary(mode) {
      return {
        mode,
        samples: 0,
        finite: true,
        shapeValid: true,
        maxDynamics: {
          fast: 0,
          slow: 0,
          attack: 0,
          release: 0,
          quietness: 0,
          silenceSeconds: 0,
          crest: 0,
          surge: 0,
        },
        maxEvents: {
          onset: { pulse: 0, strength: 0 },
          lowImpact: { pulse: 0, strength: 0 },
          midHit: { pulse: 0, strength: 0 },
          highSpark: { pulse: 0, strength: 0 },
        },
        eventTriggerCounts: { onset: 0, lowImpact: 0, midHit: 0, highSpark: 0 },
        lastEventTriggerAt: { onset: null, lowImpact: null, midHit: null, highSpark: null },
        maxLogBands: Array(24).fill(0),
        maxBandAttack: Array(24).fill(0),
        bestRhythm: { pulse: 0, phase: 0, tempo: 0, confidence: 0 },
        maxRhythmOnsets: 0,
        rhythmOnsets: [],
        maxSampleGapMs: 0,
        final: null,
      };
    }

    function finiteExpressive(value, key = '') {
      if (Array.isArray(value)) return value.length === 24 && value.every(entry => finiteExpressive(entry, key));
      if (value && typeof value === 'object') {
        return Object.entries(value).every(([nestedKey, entry]) => nestedKey === 'version' || finiteExpressive(entry, nestedKey));
      }
      if (typeof value !== 'number') return false;
      if (!Number.isFinite(value) || value < 0) return false;
      if (key === 'tempo') return value <= 300;
      if (key === 'silenceSeconds') return value <= 300;
      if (key === 'ageSeconds') return value <= 30;
      return value <= 1;
    }

    function expressiveShapeValid(value) {
      const keys = (object, expected) => JSON.stringify(Object.keys(object || {})) === JSON.stringify(expected);
      return value?.version === 'visualizer-expressive-audio-v1'
        && keys(value, ['version', 'dynamics', 'events', 'rhythm', 'frequency'])
        && keys(value?.dynamics, ['fast', 'slow', 'attack', 'release', 'quietness', 'silenceSeconds', 'crest', 'surge'])
        && keys(value?.events, ['onset', 'lowImpact', 'midHit', 'highSpark'])
        && Object.values(value?.events || {}).every(event => keys(event, ['pulse', 'strength', 'ageSeconds']))
        && keys(value?.rhythm, ['pulse', 'phase', 'tempo', 'confidence'])
        && keys(value?.frequency, ['logBands', 'bandAttack'])
        && Array.isArray(value?.frequency?.logBands)
        && value.frequency.logBands.length === 24
        && Array.isArray(value?.frequency?.bandAttack)
        && value.frequency.bandAttack.length === 24;
    }

    function recordAudioSample(summary, sample) {
      const expressive = sample?.expressive;
      if (!expressive) return;
      summary.samples += 1;
      summary.finite = summary.finite && finiteExpressive(expressive);
      summary.shapeValid = summary.shapeValid && expressiveShapeValid(expressive);
      for (const field of Object.keys(summary.maxDynamics)) {
        summary.maxDynamics[field] = Math.max(summary.maxDynamics[field], Number(expressive.dynamics[field]) || 0);
      }
      for (const field of Object.keys(summary.maxEvents)) {
        summary.maxEvents[field].pulse = Math.max(summary.maxEvents[field].pulse, Number(expressive.events[field].pulse) || 0);
        summary.maxEvents[field].strength = Math.max(summary.maxEvents[field].strength, Number(expressive.events[field].strength) || 0);
      }
      for (let index = 0; index < 24; index += 1) {
        summary.maxLogBands[index] = Math.max(summary.maxLogBands[index], Number(expressive.frequency.logBands[index]) || 0);
        summary.maxBandAttack[index] = Math.max(summary.maxBandAttack[index], Number(expressive.frequency.bandAttack[index]) || 0);
      }
      if (expressive.rhythm.confidence >= summary.bestRhythm.confidence) {
        summary.bestRhythm = { ...expressive.rhythm };
      }
      summary.final = structuredClone(expressive);
    }

    async function runPreparedAudioFixture() {
      const prepared = preparedAudioFixture;
      if (!prepared) throw new Error('Prepare an audio fixture before running it.');
      const summary = emptyAudioSummary(prepared.mode);
      if (prepared.mode === 'local') {
        await prepared.engine.resumeMediaElement(prepared.element);
        await prepared.element.play();
      } else {
        await prepared.sourceContext.resume();
        await prepared.engine.attachStream(prepared.destination.stream, prepared.mode, {});
        prepared.source.start();
      }
      const started = performance.now();
      const durationMs = prepared.durationSeconds * 1000 + 260;
      let lastSampleAt = started;
      while (performance.now() - started <= durationMs) {
        const sampledAt = performance.now();
        summary.maxSampleGapMs = Math.max(summary.maxSampleGapMs, sampledAt - lastSampleAt);
        lastSampleAt = sampledAt;
        recordAudioSample(summary, prepared.engine.sample(sampledAt));
        for (const eventName of Object.keys(summary.eventTriggerCounts)) {
          const triggeredAt = prepared.engine.expressiveProcessor?.events?.[eventName]?.lastTriggeredAt;
          if (!Number.isFinite(triggeredAt) || triggeredAt === summary.lastEventTriggerAt[eventName]) continue;
          summary.lastEventTriggerAt[eventName] = triggeredAt;
          summary.eventTriggerCounts[eventName] += 1;
        }
        const rhythmOnsets = prepared.engine.expressiveProcessor?.rhythmOnsets || [];
        if (rhythmOnsets.length >= summary.maxRhythmOnsets) {
          summary.maxRhythmOnsets = rhythmOnsets.length;
          summary.rhythmOnsets = [...rhythmOnsets];
        }
        await new Promise(resolve => setTimeout(resolve, 1000 / 60));
      }
      summary.analysisDurationMs = performance.now() - started;
      await releasePreparedAudioFixture();
      return summary;
    }

    window.prepareDecodedAudioFixture = async (url, mode = 'local') => {
      await releasePreparedAudioFixture();
      audioFixturePromise = null;
      const engine = new AudioEngine();
      if (mode === 'local') {
        const element = document.createElement('audio');
        element.preload = 'auto';
        element.src = url;
        document.body.appendChild(element);
        element.load();
        await new Promise((resolve, reject) => {
          if (Number.isFinite(element.duration) && element.duration > 0) resolve();
          else {
            element.addEventListener('loadedmetadata', resolve, { once: true });
            element.addEventListener('error', () => reject(new Error('Synthetic fixture did not decode.')), { once: true });
          }
        });
        await engine.connectMediaElement(element);
        preparedAudioFixture = { mode, engine, element, durationSeconds: element.duration };
      } else {
        const sourceContext = new AudioContext();
        const encoded = await (await fetch(url)).arrayBuffer();
        const buffer = await sourceContext.decodeAudioData(encoded.slice(0));
        const source = sourceContext.createBufferSource();
        const destination = sourceContext.createMediaStreamDestination();
        source.buffer = buffer;
        source.connect(destination);
        preparedAudioFixture = {
          mode: mode === 'display' ? 'display' : 'microphone',
          engine,
          sourceContext,
          source,
          destination,
          durationSeconds: buffer.duration,
        };
      }
      return { mode: preparedAudioFixture.mode, durationSeconds: preparedAudioFixture.durationSeconds };
    };

    document.getElementById('audioFixtureStart').addEventListener('click', () => {
      if (!audioFixturePromise) audioFixturePromise = runPreparedAudioFixture();
    });

    window.audioFixtureResult = () => {
      if (!audioFixturePromise) throw new Error('Start the prepared audio fixture first.');
      return audioFixturePromise;
    };

    window.__reliabilityHarnessReady = true;
  </script>
</body>
</html>
